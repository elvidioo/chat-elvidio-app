name: Build Chat Elvidio APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Creer le projet Android
        run: flutter create --platforms=android --project-name chat_elvidio_app .

      - name: Configurer Android (permissions, minSdk)
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          perms = ["INTERNET", "ACCESS_WIFI_STATE", "CHANGE_WIFI_STATE", "BLUETOOTH", "BLUETOOTH_ADMIN",
                   "ACCESS_COARSE_LOCATION", "ACCESS_FINE_LOCATION", "BLUETOOTH_ADVERTISE",
                   "BLUETOOTH_CONNECT", "BLUETOOTH_SCAN", "NEARBY_WIFI_DEVICES", "REQUEST_INSTALL_PACKAGES", "POST_NOTIFICATIONS", "RECORD_AUDIO", "CAMERA", "MODIFY_AUDIO_SETTINGS", "USE_FULL_SCREEN_INTENT", "REQUEST_IGNORE_BATTERY_OPTIMIZATIONS", "WAKE_LOCK", "VIBRATE"]
          mf = Path("android/app/src/main/AndroidManifest.xml")
          x = mf.read_text()
          lines = "".join('    <uses-permission android:name="android.permission.%s"/>\n' % p for p in perms)
          x = x.replace("<application", lines + "    <application", 1)
          link = ('        <intent-filter>\n'
                  '            <action android:name="android.intent.action.VIEW"/>\n'
                  '            <category android:name="android.intent.category.DEFAULT"/>\n'
                  '            <category android:name="android.intent.category.BROWSABLE"/>\n'
                  '            <data android:scheme="chatelvidio" android:host="login-callback"/>\n'
                  '        </intent-filter>\n'
                  '        <meta-data android:name="flutter_deeplinking_enabled" android:value="false"/>\n')
          # Les appels entrants peuvent allumer l'écran et s'afficher sur l'écran verrouillé.
          x = re.sub(r'android:label="[^"]*"', 'android:label="Chat Elvidio"', x, count=1)
          x = x.replace('android:name=".MainActivity"', 'android:name=".MainActivity" android:showWhenLocked="true" android:turnScreenOn="true"', 1)
          x = x.replace("</activity>", link + "    </activity>", 1)
          mf.write_text(x)
          # Scanner QR : modèle ML Kit téléchargé par Google Play Services (APK plus léger)
          gp = Path("android/gradle.properties")
          gp.write_text(gp.read_text() + "\ndev.steenbakker.mobile_scanner.useUnbundled=true\n")
          for name in ("android/app/build.gradle.kts", "android/app/build.gradle"):
              f = Path(name)
              if f.exists():
                  g = f.read_text()
                  g = re.sub(r"minSdk(Version)?\s*=?\s*flutter\.minSdkVersion", "minSdk = 23", g)
                  if name.endswith(".kts"):
                      if "isCoreLibraryDesugaringEnabled" not in g:
                          g = g.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true", 1)
                          g += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
                  else:
                      if "coreLibraryDesugaringEnabled" not in g:
                          g = g.replace("compileOptions {", "compileOptions {\n        coreLibraryDesugaringEnabled true", 1)
                          g += '\ndependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"\n}\n'
                  f.write_text(g)
          PY

      - name: Configurer Firebase (notifications)
        run: |
          python3 - <<'PY'
          import re, shutil, sys
          from pathlib import Path
          shutil.copy("ci/google-services.json", "android/app/google-services.json")
          ok = 0
          for name in ("android/settings.gradle.kts", "android/settings.gradle"):
              f = Path(name)
              if f.exists():
                  s = f.read_text()
                  if "com.google.gms.google-services" not in s:
                      if name.endswith(".kts"):
                          s2 = re.sub(r'(id\("com\.android\.application"\) version "[^"]+" apply false)', r'\1\n    id("com.google.gms.google-services") version "4.4.2" apply false', s, count=1)
                      else:
                          s2 = re.sub(r"(id ['\"]com\.android\.application['\"] version ['\"][^'\"]+['\"] apply false)", r"\1\n    id 'com.google.gms.google-services' version '4.4.2' apply false", s, count=1)
                      if s2 != s:
                          f.write_text(s2); ok += 1
          for name in ("android/app/build.gradle.kts", "android/app/build.gradle"):
              f = Path(name)
              if f.exists():
                  s = f.read_text()
                  if "com.google.gms.google-services" not in s:
                      if name.endswith(".kts"):
                          s2 = s.replace('id("com.android.application")', 'id("com.android.application")\n    id("com.google.gms.google-services")', 1)
                      else:
                          s2 = s.replace("id 'com.android.application'", "id 'com.android.application'\n    id 'com.google.gms.google-services'", 1).replace('id "com.android.application"', 'id "com.android.application"\n    id "com.google.gms.google-services"', 1)
                      if s2 != s:
                          f.write_text(s2); ok += 1
          print("plugin google-services applique :", ok)
          if ok < 2:
              print("::warning title=Firebase::plugin google-services non applique (%d/2)" % ok)
          PY

      - name: Forcer la signature (cle privee si fournie, sinon cle fixe publique)
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          python3 - <<'PY'
          import sys, os, base64
          from pathlib import Path
          ks = Path("ci/debug.keystore").resolve()
          store_pass = "android"; key_alias = "androiddebugkey"
          if os.environ.get("KS_B64") and os.environ.get("KS_PASS"):
              priv = Path(os.environ["RUNNER_TEMP"]) / "release.p12"
              priv.write_bytes(base64.b64decode(os.environ["KS_B64"]))
              ks = priv.resolve(); store_pass = os.environ["KS_PASS"]; key_alias = "elvidio"
              print("::notice title=Signature::cle privee utilisee")
          else:
              print("::warning title=Signature::cle publique du depot utilisee (aucun secret KEYSTORE_B64)")
          kts = Path("android/app/build.gradle.kts")
          groovy = Path("android/app/build.gradle")
          cfg_kts = (
              'signingConfig = signingConfigs.create("fixed") {\n'
              '                storeFile = file("%s")\n'
              '                storeType = "pkcs12"\n'
              '                storePassword = "%s"\n'
              '                keyAlias = "%s"\n'
              '                keyPassword = "%s"\n'
              '            }' % (ks, store_pass, key_alias, store_pass)
          )
          cfg_groovy = (
              'signingConfig signingConfigs.create("fixed") {\n'
              '                storeFile file("%s")\n'
              '                storeType "pkcs12"\n'
              '                storePassword "%s"\n'
              '                keyAlias "%s"\n'
              '                keyPassword "%s"\n'
              '            }' % (ks, store_pass, key_alias, store_pass)
          )
          done = False
          if kts.exists():
              s = kts.read_text()
              old = 'signingConfig = signingConfigs.getByName("debug")'
              if old in s:
                  kts.write_text(s.replace(old, cfg_kts, 1)); done = True
          if not done and groovy.exists():
              s = groovy.read_text()
              for old in ('signingConfig signingConfigs.debug', 'signingConfig = signingConfigs.debug'):
                  if old in s:
                      groovy.write_text(s.replace(old, cfg_groovy, 1)); done = True; break
          print("signature fixe appliquee :", done)
          if not done:
              print("::error title=Signature::motif de signature introuvable dans build.gradle")
              sys.exit(1)
          PY

      - name: Installer les dependances
        run: flutter pub get

      - name: Analyse Flutter
        continue-on-error: true
        run: |
          rm -f test/widget_test.dart
          flutter analyze > analyze.txt 2>&1 || true
          E=$(grep -c "^ *error •" analyze.txt || true)
          W=$(grep -c "^ *warning •" analyze.txt || true)
          I=$(grep -c "^ *info •" analyze.txt || true)
          echo "::notice::flutter analyze : $E erreurs, $W avertissements, $I infos"
          grep -E "^ *(error|warning) •" analyze.txt | head -8 | while read -r l; do echo "::warning::$l"; done

      - name: Tests unitaires
        run: |
          rm -f test/widget_test.dart
          flutter test

      - name: Versions des plugins
        run: |
          V=$(awk '/^  (shared_preferences|shared_preferences_android|supabase_flutter|gotrue|path_provider_android):/{n=$1} /^    version:/{if(n){printf "%s %s | ", n, $2; n=""}}' pubspec.lock)
          echo "::notice title=Versions::$V"

      - name: Corriger les plugins sans namespace
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          root = Path.home() / ".pub-cache" / "hosted" / "pub.dev"
          for gradle in root.glob("*/android/build.gradle"):
              g = gradle.read_text()
              if "namespace" in g:
                  continue
              manifest = gradle.parent / "src" / "main" / "AndroidManifest.xml"
              if not manifest.exists():
                  continue
              m = re.search(r'package="([^"]+)"', manifest.read_text())
              if not m:
                  continue
              g = re.sub(r"android\s*\{", "android {\n    namespace '%s'" % m.group(1), g, count=1)
              gradle.write_text(g)
              print("namespace ajoute :", gradle)
          PY

      - name: Utiliser une cle de signature fixe (mises a jour possibles)
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - name: Compiler l APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi --no-shrink --obfuscate --split-debug-info=build/debug-info --build-number=${{ github.run_number }} --dart-define=BUILD_NUMBER=${{ github.run_number }} --target-platform android-arm,android-arm64 --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" 2>&1 | tee build.log

      - name: Afficher les erreurs de compilation
        if: failure()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          grep -nE "error|Error|FAILURE|went wrong|Could not|e: |Execution failed|not found|Unresolved|undefined|isn.t defined|doesn.t" build.log | head -25 > /tmp/err.txt || true
          if [ -n "$SUPABASE_ANON_KEY" ]; then sed -i "s|$SUPABASE_ANON_KEY|***|g" /tmp/err.txt; fi
          MSG=$(cut -c1-300 /tmp/err.txt | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Erreurs de compilation::$MSG"

      - name: Garder les APK complets
        run: |
          ls -la build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk chat-elvidio.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk chat-elvidio-arm32.apk
          zip chat-elvidio-apk.zip chat-elvidio.apk

      - name: Compiler la version Lite (sans appels, plus petite)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -o pipefail
          python3 - <<'PY'
          import json, re, copy
          from pathlib import Path
          # Autre application (autre identifiant) : s'installe a cote de la complete.
          for name in ("android/app/build.gradle.kts", "android/app/build.gradle"):
              f = Path(name)
              if f.exists():
                  g = f.read_text()
                  g2 = re.sub(r'(applicationId\s*=?\s*")([^"]+)(")', r'\1\2.lite\3', g, count=1)
                  assert g2 != g, "applicationId introuvable"
                  f.write_text(g2)
          mf = Path("android/app/src/main/AndroidManifest.xml")
          x = mf.read_text()
          x = re.sub(r'android:label="[^"]*"', 'android:label="Chat Elvidio Lite"', x, count=1)
          mf.write_text(x)
          gs = Path("android/app/google-services.json")
          d = json.loads(gs.read_text())
          c = copy.deepcopy(d["client"][0])
          c["client_info"]["android_client_info"]["package_name"] += ".lite"
          d["client"].append(c)
          gs.write_text(json.dumps(d))
          PY
          sed -i '/flutter_webrtc:/d' pubspec.yaml
          cp ci/lite/call_service.dart lib/call_service.dart
          rm -f lib/screens/call_screen.dart
          flutter pub get
          flutter build apk --release --split-per-abi --no-shrink --obfuscate --split-debug-info=build/debug-info-lite --build-number=${{ github.run_number }} --dart-define=BUILD_NUMBER=${{ github.run_number }} --dart-define=LITE=true --target-platform android-arm,android-arm64 --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" 2>&1 | tee build-lite.log
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk chat-elvidio-lite.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk chat-elvidio-lite-arm32.apk
          ls -la chat-elvidio*.apk

      - name: Publier les APK sur la page Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" chat-elvidio.apk chat-elvidio-arm32.apk chat-elvidio-apk.zip chat-elvidio-lite.apk chat-elvidio-lite-arm32.apk \
            --title "Chat Elvidio build ${{ github.run_number }}" \
            --notes "chat-elvidio.apk = complet, telephones 64 bits (la plupart). chat-elvidio-arm32.apk = complet, anciens telephones 32 bits. chat-elvidio-lite.apk / chat-elvidio-lite-arm32.apk = version Lite plus petite, sans appels audio/video." \
            --latest

      - name: Publier l APK
        uses: actions/upload-artifact@v4
        with:
          name: chat-elvidio-apk
          path: chat-elvidio*.apk
