name: Build Chat Elvidio APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Creer le projet Android
        run: flutter create --platforms=android --project-name chat_elvidio_app .

      - name: Configurer Android (permissions, minSdk)
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          perms = ["INTERNET", "ACCESS_WIFI_STATE", "CHANGE_WIFI_STATE", "BLUETOOTH", "BLUETOOTH_ADMIN",
                   "ACCESS_COARSE_LOCATION", "ACCESS_FINE_LOCATION", "BLUETOOTH_ADVERTISE",
                   "BLUETOOTH_CONNECT", "BLUETOOTH_SCAN", "NEARBY_WIFI_DEVICES"]
          mf = Path("android/app/src/main/AndroidManifest.xml")
          x = mf.read_text()
          lines = "".join('    <uses-permission android:name="android.permission.%s"/>\n' % p for p in perms)
          x = x.replace("<application", lines + "    <application", 1)
          mf.write_text(x)
          for name in ("android/app/build.gradle.kts", "android/app/build.gradle"):
              f = Path(name)
              if f.exists():
                  g = f.read_text()
                  g = re.sub(r"minSdk(Version)?\s*=?\s*flutter\.minSdkVersion", "minSdk = 23", g)
                  f.write_text(g)
          PY

      - name: Installer les dependances
        run: flutter pub get

      - name: Corriger les plugins sans namespace
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          root = Path.home() / ".pub-cache" / "hosted" / "pub.dev"
          for gradle in root.glob("*/android/build.gradle"):
              g = gradle.read_text()
              if "namespace" in g:
                  continue
              manifest = gradle.parent / "src" / "main" / "AndroidManifest.xml"
              if not manifest.exists():
                  continue
              m = re.search(r'package="([^"]+)"', manifest.read_text())
              if not m:
                  continue
              g = re.sub(r"android\s*\{", "android {\n    namespace '%s'" % m.group(1), g, count=1)
              gradle.write_text(g)
              print("namespace ajoute :", gradle)
          PY

      - name: Compiler l APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -o pipefail
          flutter build apk --release --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" 2>&1 | tee build.log

      - name: Afficher les erreurs de compilation
        if: failure()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          grep -nE "error|Error|FAILURE|went wrong|Could not|e: |Execution failed|not found|Unresolved|undefined|isn.t defined|doesn.t" build.log | head -25 > /tmp/err.txt || true
          if [ -n "$SUPABASE_ANON_KEY" ]; then sed -i "s|$SUPABASE_ANON_KEY|***|g" /tmp/err.txt; fi
          MSG=$(cut -c1-300 /tmp/err.txt | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Erreurs de compilation::$MSG"

      - name: Publier l APK
        uses: actions/upload-artifact@v4
        with:
          name: chat-elvidio-apk
          path: build/app/outputs/flutter-apk/app-release.apk
