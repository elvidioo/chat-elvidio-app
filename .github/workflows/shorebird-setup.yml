name: Shorebird setup (une seule fois)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: shorebirdtech/setup-shorebird@v1
      - name: Liste des apps et aide
        run: |
          ann() { printf '%s' "$2" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g' | sed "s/^/::notice title=$1::/"; echo; }
          ann apps "$(shorebird apps list 2>&1 | head -30)"
          ann release "$(shorebird release android --help 2>&1 | head -60)"
          ann patch "$(shorebird patch android --help 2>&1 | head -60)"
